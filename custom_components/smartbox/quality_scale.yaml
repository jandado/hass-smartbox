# Integration quality-scale audit.
#
# The manifest keeps "quality_scale": "custom" until every rule for a tier is
# done. Rules marked todo are known gaps, not exemptions; comments record why.
rules:
  # Bronze
  action-setup:
    status: done
    comment: The three domain services are registered after platform setup and removed with the last loaded entry.
  appropriate-polling:
    status: done
    comment: Consumption polls every 15 minutes, the PMO power sensor every 60 seconds (option) and the RTC drift every 5 minutes; README documents the intervals.
  brands:
    status: todo
    comment: A local brand/icon.png exists; the brand logo and the brands-repository entry are still missing.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: The integration declares no third-party requirements; all protocol, state and adapter layers are vendored.
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner:
    status: done
    comment: "@ajtudela and @Delmael are the manifest codeowners."
  log-when-unavailable:
    status: done
    comment: Feed loss/recovery, write failures and websocket re-probing are logged.
  parallel-updates:
    status: done
    comment: >-
      sensor is 1: every energy sensor shares SCAN_INTERVAL, so a multi-node
      account would open one REST samples read per node at the same instant and
      the platform queue keeps that out of a burst. The push-only platforms are
      0: climate, number, select and switch send actions over the single
      ws_user connection, whose frames are already ordered, and the engine
      serializes writes per node, so an extra queue would only add scene
      latency; binary_sensor has no updates or actions.
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: The suite covers about 96% of statements and 95% of branches.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud-only integration; devices are discovered from the Smartbox account, not from the local network.
  discovery-update-info:
    status: exempt
    comment: Cloud-only integration; there is no local discovery record to update.
  docs-data-update:
    status: done
    comment: README and ARCHITECTURE describe the websocket push plus the REST polling split.
  docs-examples: done
  docs-known-limitations:
    status: todo
    comment: Requirements and transport caveats are scattered through the README; add a dedicated limitations section.
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases:
    status: todo
    comment: The feature list is documented; add an explicit use-case section.
  dynamic-devices:
    status: done
    comment: NodeAdded refreshes the REST identity and the platform builders add new devices and nodes in place; a failed refresh falls back to the reload repair issue.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: No entity is disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: todo
    comment: Removed nodes stay registered and unavailable by design; there is no stale-device cleanup when an account drops a heater.

  # Platinum
  async-dependency:
    status: done
    comment: The protocol and client layers are async throughout.
  inject-websession:
    status: done
    comment: The config flow and runtime use Home Assistant's shared aiohttp session.
  strict-typing:
    status: done
    comment: mypy strict is enabled; four import lines carry targeted attr-defined ignores for Home Assistant component-root re-exports.
