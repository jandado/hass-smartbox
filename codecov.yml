# Codecov settings: https://docs.codecov.com/docs/common-recipe-list
coverage:
  status:
    project:
      default:
        target: 95%
comment:
  layout: " diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
# Both diagnostics.py and system_health.py are covered by the suite; do not
# hide them from the project coverage signal.