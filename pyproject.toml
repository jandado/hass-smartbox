[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-smartbox"
version = "3.0.0-rc.1"
description = "Home Assistant integration for Smartbox."
readme = "README.md"
requires-python = ">=3.14.2"
authors = [
  { name="Alberto Tudela", email="ajtudela@gmail.com" },
  { name="Delmael", email="delmael@outlook.com" },
  { name="graham33", email="graham@grahambennett.org" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3,<4",
    "homeassistant>=2026.5.0",
]

[dependency-groups]
dev = [
    "coverage>=7.10.6",
    "pytest>=8.3.4",
    "pytest-aiohttp>=1.0.5",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "pytest-homeassistant-custom-component>=0.13.317,<=0.14.0",
    "pytest-mock>=3.14.0",
    "pytest-sugar>=1.0.0",
    "tox>=4.24.1",
    "ruff>=0.17.1",
    "types-python-dateutil>=2.9.0.20241206",
    "mypy>=1.14.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/ajtudela/hass-smartbox"
Issues = "https://github.com/ajtudela/hass-smartbox/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Fan the suite across cores: ~3.4x on this suite (51 s -> 15 s on
# 16 cores). `-n0` forces one process, which wins for a single focused
# test where worker startup costs more than the test.
addopts = "-n auto"
# Suite-wide per-test cap (pytest-timeout); the loopback deadline test
# pins a ~2 s wall-clock bound itself - ~60x headroom under this cap.
timeout = 120


[tool.mypy]
warn_unused_configs = true

[tool.ruff]
target-version = "py314"
#fix = true
#line-length = 90

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501", # line too long
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "PLR0913",
    "PLR0917", # positional-argument subset of PLR0913
    "COM812",
    "CPY001", # no per-file copyright headers; LICENSE covers the project
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# vendored layer: `from ..smartbox_protocol` is the layer seam (one hop up
# inside the integration package); TID252 would force an absolute path
"custom_components/smartbox/smartbox_core/**" = ["TID252"]
"tests/*" = [
    "D10",
    "S105",
    "S101",
    "ANN201",
    "ANN001",
    "N802",
    "ANN202",
    "PTH123",
    "ASYNC230",
    "PT012",
    "DTZ001",
    "ANN003",
    "ANN002",
    "A001",
    "ARG001",
    "ANN204",
    "SLF001",
    "S106",
    "PLR2004",
    "B018",
    "PLR0912",
    "PT011",
]
# tools/live_probe.py: a standalone CLI that prints to stdout (T201) and
# passes raw wire payloads through (ANN401); explicit dispatch tables are
# the point of its write ops (C901/PLR0912); asserts guard builder state
# reached only via the async context manager (S101).
"tools/*" = ["T201", "ANN401", "C901", "PLR0912", "S101"]

[tool.tox]
env_list = ["3.14"]

[tool.tox.env_run_base]
# The suite imports custom_components from the checkout; the integration is
# not a distributable runtime dependency. Skipping the sdist also keeps
# local-only directories out of setuptools auto-discovery.
skip_install = true
description = "Run test under {base_python}"
dependency_groups = ["dev"]
commands = [["python", "-m", "pytest", "--cov=custom_components.smartbox", "--cov-append", "--cov-report=term", "--cov-report=xml", "--junitxml=junit.xml"]]

[tool.tox.env.min]
# The harness release that pins homeassistant==2026.5.0, the declared floor.
# The dev dependency group MUST NOT be installed here: it allows
# pytest-asyncio>=1.4.0, while harness 0.13.329 pins ==1.3.0, so resolving
# both silently upgrades the harness (and Home Assistant) to the newest
# release and turns this job into a duplicate of the default one.
description = "Run the suite against the minimum supported Home Assistant"
dependency_groups = []
deps = [
  "pytest-homeassistant-custom-component==0.13.329",
  "pytest-mock>=3.14.0",
]
# The suite's per-test timeout, xdist and coverage plugins come from the
# harness; only pytest-mock is outside it. Fail loudly if the pin drifts.
commands_pre = [["python", "-c", "import importlib.metadata as m; v = m.version('homeassistant'); assert v == '2026.5.0', f'expected 2026.5.0, got {v}'"]]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.smartbox" = [
  "*.json",
  "*.yaml",
  "brand/*.png",
  "translations/*.json",
]

[tool.sonar]
"sonar.python.version" = "3.14"
"python.coverage.reportPaths" = "coverage.xml"
"sonar.tests" = "tests"
"python.xunit.reportPath" = "junit.xml"
